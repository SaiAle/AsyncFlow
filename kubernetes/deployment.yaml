apiVersion: apps/v1
kind: Deployment
metadata:
  name: asyncflow-backend
  labels:
    app: asyncflow
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asyncflow
      component: backend
  template:
    metadata:
      labels:
        app: asyncflow
        component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/saiale/asyncflow/asyncflow-backend:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: asyncflow-secrets
                  key: db-host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asyncflow-secrets
                  key: db-password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: asyncflow-secrets
                  key: openai-api-key
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REDIS_HOST
              value: "redis"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: asyncflow-backend
spec:
  selector:
    app: asyncflow
    component: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asyncflow-frontend
  labels:
    app: asyncflow
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asyncflow
      component: frontend
  template:
    metadata:
      labels:
        app: asyncflow
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/saiale/asyncflow/asyncflow-frontend:IMAGE_TAG
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: asyncflow-frontend
spec:
  selector:
    app: asyncflow
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
